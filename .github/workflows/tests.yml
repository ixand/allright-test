name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

# One run per branch: a push and its pull_request share a group, so the public sandboxes are not hit twice.
# Runs on main are never cancelled, so API teardown always gets to delete its bookings.
concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  playwright:
    runs-on: ubuntu-latest
    # Above playwright.config.ts globalTimeout (15 min), so a hung run still uploads its report.
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests for the generator's guard rules
        run: npm run test:unit

      # Browser binaries are not cached, as the Playwright CI guide recommends.
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run tests (ui-setup, ui-chromium, ui-firefox, ui-webkit, api, generated)
        run: npx playwright test

      # API teardown appends a line here for every booking it could not delete. A retry can turn such a
      # test "flaky" and keep the run green, so the leak is checked on its own.
      - name: No bookings left on the sandbox
        if: ${{ !cancelled() }}
        run: |
          if [ -s playwright/leftover-bookings.txt ]; then
            echo "::error::API teardown left bookings on the sandbox"
            cat playwright/leftover-bookings.txt
            exit 1
          fi

      - name: Job summary
        if: ${{ !cancelled() }}
        run: node scripts/report-summary.mjs test-results/results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces, screenshots, JUnit and JSON results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          retention-days: 14
